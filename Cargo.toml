[package]
name = "browser-cli"
version = "0.1.0"
edition = "2024"
description = "Browser automation CLI using Chrome DevTools Protocol"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
secrets-broker-client = { git = "https://github.com/Osso/secrets-broker-client", rev = "9439cfa62098a6213daa466f69449bc8a99805fc" }
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
base64 = "0.22"
urlencoding = "2"

[dev-dependencies]
rmp-serde = "1"

[profile.release]
lto = false

